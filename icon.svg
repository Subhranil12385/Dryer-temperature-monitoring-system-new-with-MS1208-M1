<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d2a40"/><stop offset="1" stop-color="#050b14"/>
  </linearGradient>
  <linearGradient id="hg" gradientUnits="userSpaceOnUse" x1="0" y1="426" x2="0" y2="190">
    <stop offset="0" stop-color="#00ffcc"/><stop offset="0.55" stop-color="#ffaa00"/><stop offset="1" stop-color="#ff4444"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
    <stop offset="0" stop-color="#00ffcc" stop-opacity="0.28"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect width="512" height="512" rx="112" fill="url(#glow)"/>
<rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#00ffcc" stroke-opacity="0.35" stroke-width="4"/>
<g transform="translate(0.0 0.0) scale(1.0)">
  <!-- thermometer glow -->
  <g filter="url(#soft)" opacity="0.8" stroke="#00ffcc" stroke-width="16" fill="none">
    <path d="M226 330 V120 a30 30 0 0 1 60 0 V330 a76 76 0 1 1 -60 0 Z"/>
  </g>
  <!-- body -->
  <path d="M226 330 V120 a30 30 0 0 1 60 0 V330 a76 76 0 1 1 -60 0 Z" fill="#06121f" stroke="#00ffcc" stroke-width="14" stroke-linejoin="round"/>
  <!-- mercury -->
  <rect x="244" y="190" width="24" height="170" rx="12" fill="url(#hg)"/>
  <circle cx="256" cy="372" r="54" fill="url(#hg)"/>
  <circle cx="238" cy="354" r="11" fill="#fff" fill-opacity="0.35"/>
  <!-- tick marks -->
  <g stroke="#00ffcc" stroke-width="10" stroke-linecap="round">
    <line x1="146" y1="140" x2="190" y2="140"/>
    <line x1="164" y1="190" x2="190" y2="190"/>
    <line x1="150" y1="240" x2="190" y2="240"/>
    <line x1="164" y1="290" x2="190" y2="290"/>
  </g>
  <!-- heat waves -->
  <g fill="none" stroke="#ffaa00" stroke-width="10" stroke-linecap="round">
    <path d="M326 150 q14 -18 0 -36 q-14 -18 0 -36" opacity="0.95"/>
    <path d="M360 190 q14 -18 0 -36 q-14 -18 0 -36" opacity="0.7"/>
    <path d="M394 230 q14 -18 0 -36 q-14 -18 0 -36" opacity="0.45"/>
  </g>
  <!-- trend line -->
  <polyline points="322,330 340,300 368,318 400,262 432,284" fill="none" stroke="#00ff88" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="432" cy="284" r="11" fill="#00ff88"/>
</g>
</svg>